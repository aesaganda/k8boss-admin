# k8boss-admin RBAC.
#
# Two ClusterRoles, and the split is the point of this file:
#
#   k8boss-admin-reader   Everything the console needs to SHOW a cluster —
#                         sufficient for every GET in docs/api-contract.md.
#   k8boss-admin-writer   Only the write verbs, added on top.
#
# so that a console can be installed read-only and mutation opted into
# deliberately, by a person who had to edit a file to do it.
#
# WHAT IS LIVE IN THIS FILE, exactly — because a comment that misdescribes its
# own YAML sends operators hunting for a binding that was never there:
#
#   APPLIED   ServiceAccount k8boss-admin
#   APPLIED   ClusterRole k8boss-admin-reader
#   APPLIED   ClusterRoleBinding k8boss-admin-reader
#   APPLIED   ClusterRole k8boss-admin-writer, INCLUDING the wildcard
#             apiGroups:["*"]/resources:["*"] rule — deliberately opted into
#             below. This is cluster-admin wearing a different name: write
#             over ValidatingWebhookConfigurations, over RBAC itself, and over
#             every CRD any operator has installed. The console's own
#             ServiceAccount is a privilege-escalation path for anyone who can
#             reach its port. Chosen explicitly for this deployment; revert by
#             deleting the wildcard rule if that stops being true.
#   APPLIED   ClusterRoleBinding k8boss-admin-writer  — the last document below.
#
# So `kubectl apply -f rbac.yaml` produces a console that can read every
# cluster it is registered against and write to all of them, unrestricted.
#
# THERE ARE TWO GATES AND BOTH MUST BE OPENED for a write to reach a cluster:
#
#   1. this binding, which decides what the API server will allow, and
#   2. ADMIN_ALLOW_MUTATIONS in deployment.yaml, which decides whether the
#      console will even try (§1.6 — false makes writes return 403
#      mutations_disabled before the cluster is touched).
#
# Opening one alone is not a half-configured system, it is a working one: bound
# but with mutations disabled, the console preflights and dry-runs and refuses to
# confirm; unbound but with mutations enabled, every confirm returns a 403 that
# names the exact missing grant. Both are diagnosable. What is NOT diagnosable is
# a console that writes because a default did it quietly.
#
# Four features carry a THIRD gate of their own, off by default, because RBAC
# cannot express what makes each one different from an ordinary write:
#
#   ADMIN_NODE_DEBUG_ENABLED     §5.5 — `create pods` is identical for an nginx
#                                pod and for one mounting the node's root
#                                filesystem.
#   ADMIN_ROUTER_MANAGE_ENABLED  §14 — the console installing a proxy on the
#                                cluster's ingress path.
#   ADMIN_CLI_ENABLED            §15 — a shell running kubectl. The grant is
#                                ordinary; what is not is that everything typed
#                                there bypasses preflight, dry run, diff and the
#                                record of what changed. Its reach is set by
#                                ADMIN_CLI_SERVICE_ACCOUNT, which this file also
#                                cannot constrain — see the `create pods` rule.
#   ADMIN_PORTAL_INSTALL_ENABLED §16 — the console creating one OLM
#                                Subscription. The grant is a single `create` of
#                                a nine-line object; what it starts is Operator
#                                Lifecycle Manager installing somebody else's
#                                operator and granting it whatever its bundle
#                                asks for — with OLM's permissions, not this
#                                ServiceAccount's, so no rule in this file
#                                bounds it.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8boss-admin
  namespace: k8boss-admin
  labels:
    app.kubernetes.io/name: k8boss-admin

---
# ═══════════════════════════════════════════════════════════════════════════
# READ-ONLY — sufficient for every GET in the contract.
#
# Every rule below is annotated with the contract section it serves and with
# what breaks without it. "Breaks" is rarely a 500: the console's rule is that a
# read it could not perform lands in `unavailable[]` with `reason: forbidden`
# and `partial: true`, so a missing grant here produces a page that says which
# question it failed to answer — not a page with a shorter list.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8boss-admin-reader
  labels:
    app.kubernetes.io/name: k8boss-admin
    k8boss-admin.io/role: reader
rules:
  # §9 Access preflight. A `create` verb inside a read-only role, and that is
  # correct: a SelfSubjectAccessReview creates nothing. It asks the API server
  # "may this identity do X", which is how §0.2 preflights every mutation and how
  # §11.4 decides which buttons to disable AND WHY rather than hiding them.
  #
  # This is the one rule whose absence degrades the console globally: with no
  # review endpoint, every preflight returns allowed=false with a non-null
  # evaluationError, which the UI must render as "we could not determine whether
  # you may" — never as a denial. Withholding it does not make the console safer,
  # it makes it uninformative. Kubernetes binds this to system:basic-user for
  # every authenticated identity anyway; it is spelled out here so a cluster with
  # that binding removed still works.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]

  # §4 catalog — API discovery. These are non-resource URLs, not resources.
  # /version backs the server_version field of §2 health and §3 overview;
  # /api, /apis and their children are how app/resources/catalog.py enumerates
  # what this cluster serves. Without them the resource browser has nothing to
  # browse and every typed page's resolve() fails before it reaches a resource.
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*", "/version", "/openapi/*"]
    verbs: ["get"]

  # §5 nodes, §3 overview capacity. Also the source of `requested` and
  # `pod_count` per node — both of which become null, never 0, when the pod
  # listing below fails, because a node reading "0 pods, 0 cores requested" is
  # the one an operator picks to drain.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # §5 namespaces — the list every other page's filter is built from.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]

  # §6 pods and §7 logs. `pods/log` is a separate RBAC resource from `pods`:
  # granting the first without the second gives a console that lists pods and
  # cannot show a single line of output, which is the state most operators
  # actually notice first.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

  # §7.7 the pod page's Metrics tab. `metrics.k8s.io` is an aggregated API served
  # by metrics-server, which a great many clusters do not run — and on those the
  # tab reports `unsupported`, an ordinary fact rendered calmly, whether or not
  # this rule is present. Where the API *is* served, withholding this makes every
  # `usage` null with a `forbidden` entry rather than zero: a pod drawn at zero
  # cores reads as idle, and idle is what gets something turned off.
  #
  # `get` and `list` and no `watch`: the tab polls a one-shot read, and a verb no
  # code path issues is a grant with no feature behind it.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]

  # §5 events. The events page scans a bounded window and sorts it itself,
  # because the API server offers no server-side ordering.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

  # §8 Services and their backing endpoints. Both spellings: `endpoints` backs
  # the Network page's endpoint listing, `endpointslices` (below) backs the
  # `endpoint_count` column. Without the slices that column is null with an
  # `unavailable` entry — deliberately not 0, which would claim a Service backs
  # nothing.
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]

  # §8 config, storage and access rows.
  - apiGroups: [""]
    resources: ["configmaps", "serviceaccounts", "persistentvolumeclaims", "persistentvolumes", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]

  # §8 Secrets. THE MOST PRIVILEGED RULE IN THIS FILE — read it before applying.
  #
  # `list secrets` cluster-wide means the console's ServiceAccount can read the
  # value of every Secret in the cluster. The console itself never puts a value
  # in a list response (secret_row reads key names and byte lengths only, and the
  # single-object read redacts unless SECRET_REVEAL_ENABLED is on, a preflight
  # passes and an audit record is written) — but RBAC grants the API access, not
  # the console's discipline about it. Anyone who can exec into the console's pod
  # holds this grant directly.
  #
  # DELETE THIS RULE if you do not want that. What degrades: the Config page's
  # Secrets tab renders one `unavailable` entry saying `forbidden` on
  # `core/secrets` instead of a table. Nothing else on the console changes, and
  # nothing reports a cluster with no Secrets in it.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # §6 workloads. `controllerrevisions` is not optional for §6's rollout
  # history: a StatefulSet's and a DaemonSet's revisions ARE ControllerRevisions,
  # and without this the rollout panel for those two kinds reports that it could
  # not read history — which the UI must not render as "this workload has never
  # been rolled out".
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]

  # §6 workloads, batch kinds. Jobs and CronJobs carry the `suspended`,
  # `schedule` and `last_schedule` fields that are null on every other kind.
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]

  # §8 Ingresses, and §13's Ingress backend. `ingressclasses` fills the `class`
  # column for an Ingress whose spec names none; without it the column is blank
  # rather than wrong. §14 also lists them to answer "what else is serving
  # Ingresses on this cluster" before offering to install a router — withheld,
  # that list is `null` rather than `[]`, and the console says it does not know
  # rather than claiming nothing else is there.
  #
  # `networkpolicies` backs §8.3's Network Policies tab and §8.4's pod isolation
  # view. Note what the isolation view does when this is withheld: it fails, with
  # the 403 naming this resource. It does NOT degrade to a table of pods marked
  # unrestricted — "no policy selects this pod" assembled from a policy listing
  # that never happened is a security finding invented out of a missing grant.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses", "networkpolicies"]
    verbs: ["get", "list", "watch"]

  # §13 Routes — the OpenShift backend. Absent on every cluster that is not
  # OpenShift, and that is an ordinary state: `route.openshift.io` then resolves
  # to `unsupported`, the Routes page reports the backend as "not present on
  # this cluster", and nothing is coloured red. Withholding this rule on a
  # cluster that DOES serve Routes is different and worse — discovery is
  # refused, the backend resolves to `unknown`, and §13 deliberately refuses to
  # report that as absence.
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch"]

  # §8 storage classes — `is_default` is read from the annotation on the class,
  # so the Storage page cannot mark a default without this. `volumeattributesclasses`
  # is a newer, still-graduating API (VolumeAttributesClass); a cluster old
  # enough not to serve it renders the tab's `unsupported` — not this rule's
  # absence — so there is nothing to degrade to if it is ever dropped.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csidrivers", "volumeattributesclasses"]
    verbs: ["get", "list", "watch"]

  # §8 access rows. Reading RBAC is not the same privilege as holding it, but it
  # is a map of the cluster's permissions; drop this pair if the Access page is
  # not wanted and it degrades to a `forbidden` entry like any other.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]

  # §5 drain planning, read half. The drain planner reads PodDisruptionBudgets to
  # classify each pod as evict / skip / blocked BEFORE anything is executed.
  # Without it the plan cannot tell whether a PDB blocks an eviction and says so
  # in the plan — it does not guess, and it does not report "nothing blocks
  # this". Reading it here (rather than in the writer role) means an operator can
  # preview a drain plan on a read-only install.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]

  # §8 Configuration page — autoscaling and disruption controls. HPAs are a
  # built-in API and will list on any cluster; VerticalPodAutoscaler is a CRD
  # (the `autoscaling.k8s.io` VPA project, not shipped with Kubernetes), so
  # `verticalpodautoscalers` degrades to the tab's `unsupported` state on the
  # large majority of clusters that do not have it installed — expected, not a
  # sign this rule is wrong.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "list", "watch"]

  # §8 Configuration page — scheduling and workload-identity objects that carry
  # no secret material, read purely for the browser: what priority a pod can
  # claim, what runtime a sandboxed pod asks for, who currently holds a lease.
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]

  # §8 Configuration page — admission webhook configurations. These describe
  # what the cluster's admission chain does to every write; reading them is a
  # browse, not a change to what they enforce.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]

  # Gateway (beta) page. Gateway API is CRD-backed and frequently absent — on a
  # cluster without it installed, every resource below degrades to the same
  # `unsupported` "not present on this cluster" state §1.2 already defines for
  # a missing Ingress controller or missing metrics.k8s.io, not an error.
  # `backendtrafficpolicies` is deliberately not granted here: that kind's real
  # API group depends on which Gateway API implementation a cluster runs (e.g.
  # Envoy Gateway ships it under `gateway.envoyproxy.io`, not
  # `gateway.networking.k8s.io`), and granting the wrong group would be a rule
  # that looks like coverage and grants nothing.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "gatewayclasses", "httproutes", "grpcroutes", "referencegrants", "backendtlspolicies"]
    verbs: ["get", "list", "watch"]

  # §16 the operator portal, read half. Two API groups because OLM serves two:
  # `packages.operators.coreos.com` is an aggregated APIService run by the OLM
  # package server — it answers 503 when OLM is degraded rather than vanishing
  # from discovery — and `operators.coreos.com` is a set of ordinary CRDs.
  #
  # `get,list` and no `watch`: every §16 read is a one-shot live listing, and a
  # verb no code path issues is a grant with no feature behind it.
  #
  # A cluster that does not run OLM serves neither group, and that is an ordinary
  # fact: every source resolves to `unsupported`, the portal says so in a calm
  # notice and nothing is coloured red. WITHHOLDING these rules on a cluster that
  # DOES serve them is different and worse — discovery is refused, the source
  # resolves to `unknown`, and §16 refuses to report that as absence. The catalog
  # is then not empty, it is unanswerable, and the page says so with a partial
  # banner rather than reading "this cluster offers no operators", which would
  # send somebody to add a CatalogSource that is already there.
  - apiGroups: ["packages.operators.coreos.com"]
    resources: ["packagemanifests"]
    verbs: ["get", "list"]

  # `subscriptions` is what fills the catalog's `installed` column, and that
  # column is tri-state: without this rule it is null for every package, never
  # false, because "not installed" for an operator that IS installed is how you
  # get a second Subscription and two resolutions competing for the same CRDs.
  # `clusterserviceversions` and `installplans` answer whether OLM actually did
  # anything about a Subscription — withheld, each row's `phase` is null with the
  # reason, never `Failed`, which would report a healthy operator as broken.
  # `catalogsources` says where the packages came from and whether that registry
  # is answering. `operatorgroups` is what the subscribe plan reads to decide
  # whether OLM can install into the target namespace at all: withheld,
  # `target.ready` is null and the plan warns that it could not check, rather
  # than claiming a namespace has no OperatorGroup.
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions", "clusterserviceversions", "installplans", "catalogsources", "operatorgroups"]
    verbs: ["get", "list"]

  # §4 generic browse. The resource browser reaches anything the cluster serves,
  # including CRDs the console has never heard of, so it needs to enumerate the
  # CRDs themselves. Reading the definitions is not reading the custom objects:
  # a CRD this role does not name is listed in the catalog and returns
  # `forbidden` when browsed, which is the honest answer.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8boss-admin-reader
  labels:
    app.kubernetes.io/name: k8boss-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8boss-admin-reader
subjects:
  - kind: ServiceAccount
    name: k8boss-admin
    namespace: k8boss-admin

---
# ═══════════════════════════════════════════════════════════════════════════
# WRITE — the verbs that change a cluster. Additive: this role holds no read
# rules, so it is useless on its own and must be bound alongside the reader.
#
# Every verb here is reachable only through app/admin/mutate.py, which gates on
# ADMIN_ALLOW_MUTATIONS, preflights the exact target, dry-runs, diffs and audits
# — in that order, in one function. This role decides what that funnel is
# permitted to do once it gets there.
#
# NOTE ON DRY-RUN: `dryRun=All` is not a lesser permission. The API server
# requires the same verb to project a write as to perform one, which is why
# every write verb below is needed even for a console that only ever previews.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8boss-admin-writer
  labels:
    app.kubernetes.io/name: k8boss-admin
    k8boss-admin.io/role: writer
rules:
  # §6 scale. `deployments/scale` is a separate RBAC resource from `deployments`,
  # which is the whole reason the console patches the subresource: a
  # ServiceAccount can be allowed to resize a workload without being allowed to
  # edit it. Grant this pair alone for a resize-only console.
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale", "replicasets/scale"]
    verbs: ["get", "patch", "update"]

  # §6 restart, suspend, rollback and the §4 YAML editor over workload kinds.
  # `patch` covers restart (a timestamp annotation on the pod template, the same
  # mechanism as `kubectl rollout restart`) and rollback (an RFC 6902 replace of
  # /spec/template). `update` covers the editor's PUT, `create` its POST,
  # `delete` its delete.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "update", "patch", "delete"]

  # §5 cordon and drain, node half. `patch nodes` sets spec.unschedulable. Note
  # this grants cordon of ANY node, including control-plane nodes.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch", "update"]

  # §5 drain, pod half. `pods/eviction` is the API that respects
  # PodDisruptionBudgets; the console never deletes a pod to drain a node,
  # because delete ignores PDBs and would make the console a bigger hammer than
  # `kubectl drain`. `delete pods` is here for the resource browser's own delete
  # button, which is a different action with a different confirm dialog.
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]

  # §5.5 node debug pods, §15 CLI pods, and §4's "create anything" from the YAML
  # editor. One rule, because RBAC cannot tell them apart.
  #
  # Read that again before granting it. A SelfSubjectAccessReview answers on
  # verb/group/resource/namespace/name/subresource and has no field-level
  # granularity at all: there is no verb for `hostPath`, none for `hostPID`,
  # none for `privileged`. `create pods` that succeeds for an nginx pod succeeds
  # identically for a pod that mounts the node's root filesystem. The layer that
  # once gated this — PodSecurityPolicy's `use` on a podsecuritypolicies
  # resource — was removed in Kubernetes 1.25, and its replacement, Pod Security
  # admission, is namespace-label-based rather than RBAC-based.
  #
  # So the controls that actually apply to a node debug pod are not here. They
  # are ADMIN_NODE_DEBUG_ENABLED in the deployment (off by default, and the only
  # switch this console owns) and the `pod-security.kubernetes.io/enforce` label
  # on the namespace it creates into. Removing this rule withholds node debug
  # pods, and withholds the YAML editor's ability to create anything, together.
  #
  # §15's CLI pod is the same rule and adds a second thing RBAC cannot express:
  # there is no verb covering which ServiceAccount a pod may BIND. Whoever holds
  # this rule can create a pod bound to any account in the namespace, including
  # one more privileged than this ClusterRole — and a shell in that pod then has
  # that account's permissions. The controls that actually apply are
  # ADMIN_CLI_ENABLED and ADMIN_CLI_SERVICE_ACCOUNT in the deployment, both of
  # which this file cannot enforce.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create"]

  # §7 exec — a shell inside a running container. The most dangerous grant in
  # this file after the wildcard below: it bypasses every other control here,
  # because a shell in a pod can do whatever that pod's own ServiceAccount can.
  # The console additionally requires ADMIN_ALLOW_MUTATIONS for exec (it is a
  # write in every sense that matters) and audits the session on open and close.
  # Remove this rule for a console that can read logs but not type into a
  # container; the terminal button then disables itself with the reason.
  #
  # It is also what §15's CLI session runs on — that feature adds no exec route
  # of its own — so removing this withholds the masthead terminal too, while
  # leaving the CLI pod creatable. The pair to remove for "no CLI at all" is
  # ADMIN_CLI_ENABLED in the deployment.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

  # §7.4 debug containers — `kubectl debug`'s ephemeral container, for the pod
  # whose image is a distroless binary with no shell to exec into. A separate
  # RBAC resource from `pods` and a separate grant from `pods/exec`: attaching a
  # container and typing in one are different acts, and an install may
  # reasonably want the second without the first.
  #
  # Close to `pods/exec` in blast radius, and for a reason worth stating: the
  # operator chooses the image, and the container it becomes shares the pod's
  # network namespace, its volumes, and — on request — the process namespace of
  # an application container. `get` as well as `patch` because the console reads
  # the subresource to build the diff it shows before writing; without it every
  # attach fails at the preview step naming `get pods/ephemeralcontainers`,
  # which is at least an accurate error.
  #
  # Note there is no delete verb to grant. The Kubernetes API has none for an
  # ephemeral container: once attached it lives as long as the pod does, and
  # restarting the workload is what removes it. Remove this rule for a console
  # that can exec into what is already there but cannot add to it; the Attach
  # button then disables itself with the reason, and the listing of what is
  # already attached keeps working, because that reads the pod.
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["get", "patch"]

  # §4/§8 config, storage and networking writes — the YAML editor and the delete
  # button on those pages. `secrets` is included because the editor offers the
  # same operations on every §8 row; drop it to keep Secret writing out of the
  # console while leaving the rest editable.
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["create", "update", "patch", "delete"]
  # `networkpolicies` is what the Network policies tab's New / Edit YAML / Delete
  # buttons need. Dropping it leaves that tab fully readable — and the pod
  # isolation view, which is the reason to open it, needs no write verb at all.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["create", "update", "patch", "delete"]

  # §13 writes. Three separate rules because they are three separate RBAC
  # resources, and an install may reasonably want one without the others: an
  # account allowed to write Ingresses is very often not allowed to write
  # Routes. Withholding any one of them disables that backend's create button
  # with the reason (§11.4) rather than hiding it.
  #
  # `routes/custom-host` is NOT optional if Routes are wanted, and it is the
  # rule people miss. OpenShift gates *choosing a hostname* behind its own
  # subresource, separately from creating the Route at all. Without it, the
  # console's preflight on `create routes` passes, the API server refuses the
  # write, and the operator is told they cannot create Routes — a permission
  # the review just confirmed they hold. §13 preflights the subresource
  # explicitly so the denial names this line.
  - apiGroups: ["route.openshift.io"]
    resources: ["routes", "routes/custom-host"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["create", "update", "patch", "delete"]

  # §14 the shipped router. THE SECOND-LARGEST GRANT IN THIS FILE after the
  # wildcard below — read it before applying.
  #
  # These are the verbs the console needs to CREATE the router's own objects.
  # The router's ClusterRole, which these let the console create, is what can
  # then read every Secret in the cluster: an ingress controller that terminates
  # TLS must read certificate Secrets, and RBAC cannot scope that to "only the
  # ones an Ingress references". The console shows that object in the diff
  # before creating it, which is the only honest way to hand somebody a grant
  # of that size.
  #
  # DELETE THESE RULES to keep the console out of the business of installing a
  # data plane. What degrades: the Routes page's router panel reports the
  # install action as denied with the reason, the plan stays readable (it is a
  # pure render and touches no cluster), and every §13 exposure keeps working
  # against whatever controller the cluster already runs.
  - apiGroups: [""]
    resources: ["namespaces", "serviceaccounts"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["create", "update", "patch", "delete"]

  # §14, and the rule whose absence produces the most confusing failure in this
  # whole file.
  #
  # `escalate` and `bind` are not ordinary verbs. Kubernetes refuses to let an
  # identity create a ClusterRole granting permissions it does not itself hold,
  # or bind a role it does not hold — enforced at admission, not by RBAC verb
  # matching, and therefore INVISIBLE to a SelfSubjectAccessReview. Without
  # these two, the console's preflight on `create clusterroles` answers "yes",
  # object 3 of 8 then fails with 403 `attempt to grant extra privileges`, and
  # the install is half-finished.
  #
  # `escalate` is a privilege-escalation primitive by design: it lets this
  # ServiceAccount write a role granting anything, including more than it holds.
  # It is granted here only because the console is already bound to the wildcard
  # rule below. On a deployment that has deleted that rule, granting `escalate`
  # re-opens what deleting it closed — so delete these two along with it.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["escalate"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["bind"]

  # §16 the operator portal — THE ONE WRITE IT MAKES, and the whole grant is
  # this line. No `update`, no `delete`, and no verb over anything OLM creates
  # from it.
  #
  # Read what it reaches, because this file cannot say it in a rule. The console
  # creates one Subscription; Operator Lifecycle Manager then resolves it and
  # installs the operator — its InstallPlan, its ClusterServiceVersion, its
  # ServiceAccount, and the Roles and ClusterRoles its bundle asks for. OLM does
  # that with ITS OWN permissions, so nothing here narrows what the installed
  # operator ends up holding, and no SelfSubjectAccessReview can preview it. The
  # plan names the custom resources the operator will own before the write, which
  # is the most this console can honestly show.
  #
  # There is deliberately no delete verb to grant: deleting a Subscription does
  # not uninstall an operator — the ClusterServiceVersion and everything it owns
  # stay — so a Remove button here would report an uninstall that did not happen.
  # Both deletions are §4's, each with its own diff and its own audit row.
  #
  # DELETE THIS RULE to keep the console out of installing other people's
  # software. What degrades: the Subscribe button is disabled with the reason
  # (§11.4), the plan stays readable — it is a pure read — and the catalog and
  # Installed views keep working from the reader rules above.
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions"]
    verbs: ["create"]

  # §4 generic write over ANYTHING the cluster serves — CRDs included.
  #
  # OPTED IN for this deployment, on explicit request. Without the rules above,
  # this alone would be the only line standing between the resource browser and
  # every object the cluster serves; it is cluster-admin wearing a different
  # name. It grants write over ValidatingWebhookConfigurations, over RBAC
  # itself, and over every CRD any operator has installed — and it makes the
  # console's own ServiceAccount a privilege-escalation path for anyone who can
  # reach its port. Delete this rule to fall back to the typed-resource-only
  # writer role above it, which is what the console's UI actually uses.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["create", "update", "patch", "delete"]

# ─────────────────────────────────────────────────────────────────────────────
# ClusterRoleBinding for the writer role — OPTED IN.
#
# The binding is applied before ADMIN_ALLOW_MUTATIONS is set in deployment.yaml,
# same ordering the read-only default documented: the console's own connection
# test reports the write permissions as held before anything offers a button
# that uses them.
#
# To go back to read-only, do the reverse and delete the binding:
#
#   kubectl delete clusterrolebinding k8boss-admin-writer
#   kubectl -n k8boss-admin set env deployment/k8boss-admin-backend ADMIN_ALLOW_MUTATIONS=false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8boss-admin-writer
  labels:
    app.kubernetes.io/name: k8boss-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8boss-admin-writer
subjects:
  - kind: ServiceAccount
    name: k8boss-admin
    namespace: k8boss-admin
