# The router k8boss-admin ships (§14) — the same objects the console installs.
#
# GENERATED. Do not edit by hand: `backend/app/admin/router_bundle.py` is the
# source, and `backend/tests/test_router.py::test_the_shipped_manifest_matches_the_bundle`
# fails the build if this file and that module disagree. Regenerate with:
#
#     make router-manifest
#
# It exists so that `kubectl apply -f deploy/router.yaml` and pressing Install in
# the console are demonstrably the same install, and so that every version bump
# shows up as a reviewable diff rather than as one changed string in a Python
# file. It carries the DEFAULT options — namespace k8boss-router, a
# LoadBalancer Service, two replicas, the `haproxy` IngressClass, not the
# cluster default, no Gateway API. The console lets an operator change all five;
# this file is what they get if they change none.
#
# READ THE ClusterRole BEFORE APPLYING. It grants get/list/watch on Secrets
# cluster-wide, which is what any ingress controller needs to terminate TLS and
# which RBAC cannot narrow to "only the referenced ones". Applying this gives
# the router's ServiceAccount the ability to read every Secret in the cluster.
---
apiVersion: v1
kind: Namespace
metadata:
  name: k8boss-router
  labels:
    app.kubernetes.io/name: k8boss-admin-router
    app.kubernetes.io/component: router
    app.kubernetes.io/managed-by: k8boss-admin
    app.kubernetes.io/part-of: k8boss-admin
    app.kubernetes.io/version: 3.2.13
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8boss-admin-router
  labels:
    app.kubernetes.io/name: k8boss-admin-router
    app.kubernetes.io/component: router
    app.kubernetes.io/managed-by: k8boss-admin
    app.kubernetes.io/part-of: k8boss-admin
    app.kubernetes.io/version: 3.2.13
  namespace: k8boss-router

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8boss-admin-router
  labels:
    app.kubernetes.io/name: k8boss-admin-router
    app.kubernetes.io/component: router
    app.kubernetes.io/managed-by: k8boss-admin
    app.kubernetes.io/part-of: k8boss-admin
    app.kubernetes.io/version: 3.2.13
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  - endpoints
  - nodes
  - pods
  - services
  - namespaces
  - events
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  - extensions
  - networking.k8s.io
  resources:
  - ingresses
  - ingressclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - extensions
  - networking.k8s.io
  resources:
  - ingresses/status
  verbs:
  - update
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
- apiGroups:
  - ingress.v1.haproxy.org
  - ingress.v3.haproxy.org
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
  - update
- apiGroups:
  - apps
  resources:
  - replicasets
  - deployments
  - daemonsets
  verbs:
  - get
  - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8boss-admin-router
  labels:
    app.kubernetes.io/name: k8boss-admin-router
    app.kubernetes.io/component: router
    app.kubernetes.io/managed-by: k8boss-admin
    app.kubernetes.io/part-of: k8boss-admin
    app.kubernetes.io/version: 3.2.13
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8boss-admin-router
subjects:
- kind: ServiceAccount
  name: k8boss-admin-router
  namespace: k8boss-router

---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: haproxy
  labels:
    app.kubernetes.io/name: k8boss-admin-router
    app.kubernetes.io/component: router
    app.kubernetes.io/managed-by: k8boss-admin
    app.kubernetes.io/part-of: k8boss-admin
    app.kubernetes.io/version: 3.2.13
spec:
  controller: haproxy.org/ingress-controller

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8boss-admin-router
  labels:
    app.kubernetes.io/name: k8boss-admin-router
    app.kubernetes.io/component: router
    app.kubernetes.io/managed-by: k8boss-admin
    app.kubernetes.io/part-of: k8boss-admin
    app.kubernetes.io/version: 3.2.13
  namespace: k8boss-router
data:
  ssl-redirect-port: '443'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8boss-admin-router
  labels:
    app.kubernetes.io/name: k8boss-admin-router
    app.kubernetes.io/component: router
    app.kubernetes.io/managed-by: k8boss-admin
    app.kubernetes.io/part-of: k8boss-admin
    app.kubernetes.io/version: 3.2.13
  namespace: k8boss-router
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: k8boss-admin-router
      app.kubernetes.io/component: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8boss-admin-router
        app.kubernetes.io/component: router
        app.kubernetes.io/managed-by: k8boss-admin
        app.kubernetes.io/part-of: k8boss-admin
        app.kubernetes.io/version: 3.2.13
    spec:
      serviceAccountName: k8boss-admin-router
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id001
      containers:
      - name: haproxy-ingress
        image: docker.io/haproxytech/kubernetes-ingress:3.2.13
        args:
        - --configmap=k8boss-router/k8boss-admin-router
        - --ingress.class=haproxy
        - --publish-service=k8boss-router/k8boss-admin-router
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 250m
            memory: 400Mi
          limits:
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 1042
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 1042
          initialDelaySeconds: 5
          periodSeconds: 5
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        - name: stat
          containerPort: 1024
        env:
        - name: TZ
          value: Etc/UTC
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

---
apiVersion: v1
kind: Service
metadata:
  name: k8boss-admin-router
  labels:
    app.kubernetes.io/name: k8boss-admin-router
    app.kubernetes.io/component: router
    app.kubernetes.io/managed-by: k8boss-admin
    app.kubernetes.io/part-of: k8boss-admin
    app.kubernetes.io/version: 3.2.13
  namespace: k8boss-router
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: k8boss-admin-router
    app.kubernetes.io/component: router
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  - name: https
    port: 443
    protocol: TCP
    targetPort: 8443
