# Plain manifests, applied in dependency order.
#
#   kubectl apply -k deploy/
#
# What that gets you, AS CURRENTLY EDITED: both write gates are open —
# ADMIN_ALLOW_MUTATIONS is "true" in deployment.yaml and the writer
# ClusterRoleBinding in rbac.yaml (including its wildcard apiGroups:["*"] rule)
# is applied — and the backend authenticates via a mounted kubeconfig
# (IN_CLUSTER_MODE=false) instead of the pod's own ServiceAccount. Create the
# k8boss-admin-kubeconfig Secret before applying, or the backend has no cluster
# to talk to until one is registered through the UI. See the headers of
# rbac.yaml and deployment.yaml for what each opt-in costs and how to revert it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Not set as a kustomize `namespace:` override. The manifests name their
# namespace explicitly, and the ClusterRoleBinding's subject has to name it too —
# a global override would rewrite the objects and silently leave the binding's
# subject pointing at the old one, producing a console whose every read is
# forbidden for a reason nothing in the output mentions.
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  # Commented out on purpose: ingress.yaml carries a placeholder host
  # (k8boss-admin.example.com) and no ingressClassName, so applying it as shipped
  # creates an Ingress that routes nothing. Edit it, then uncomment.
  # - ingress.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: k8boss-admin
      app.kubernetes.io/managed-by: kustomize

# Pin the images you actually run. `latest` in deployment.yaml is convenient for
# a first look and wrong for anything else: with imagePullPolicy IfNotPresent a
# node that already has a `latest` layer never fetches the new one, so half a
# fleet runs last month's console and nothing says so.
images:
  - name: ghcr.io/aesaganda/k8boss-admin-backend
    newTag: latest
  - name: ghcr.io/aesaganda/k8boss-admin-frontend
    newTag: latest
