# The two Deployments and the volume that holds the console's own state.
#
# Backend and frontend are separate Deployments rather than two containers in one
# pod: the frontend is a stateless nginx that scales freely, and the backend is
# pinned to one replica by the SQLite database below. Coupling them would drag
# the frontend down to one replica for no reason.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8boss-admin-data
  namespace: k8boss-admin
  labels:
    app.kubernetes.io/name: k8boss-admin
spec:
  accessModes:
    # ReadWriteOnce, which is what forces replicas: 1 on the backend below.
    # Both the SQLite database and the Fernet key that encrypts stored cluster
    # tokens live on this volume, together on purpose: a snapshot that captures
    # one captures the other. A backup with the database and not the key restores
    # to a console whose every registered credential is undecryptable.
    - ReadWriteOnce
  resources:
    requests:
      # The console caches no cluster contents — every resource the UI shows is
      # read live — so this holds registrations plus the audit trail and grows
      # only with write activity. 1Gi is years of it. Raise it if you keep audit
      # history for a long retention period.
      storage: 1Gi
  # storageClassName: ""   # set to pin a class; omitted uses the cluster default

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8boss-admin-backend
  namespace: k8boss-admin
  labels:
    app.kubernetes.io/name: k8boss-admin
    app.kubernetes.io/component: backend
spec:
  # ONE. Not a placeholder to raise later: the backend writes a SQLite file on a
  # ReadWriteOnce volume, and a second replica either cannot mount it or corrupts
  # it. Moving to PostgreSQL (set DATABASE_URL) is what unlocks more than one.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate. A rolling update would start the new pod while
    # the old one still holds the volume, and the new one blocks on a mount that
    # cannot be granted — a deploy that hangs rather than one that restarts.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: k8boss-admin
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8boss-admin
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: k8boss-admin
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001          # so the mounted PVC is writable by that uid
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/aesaganda/k8boss-admin-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8020
          env:
            # ── The write gate (§1.6) ───────────────────────────────────────
            # OPENED, on explicit request. With it true and the writer
            # ClusterRoleBinding in rbac.yaml applied (both gates open), every
            # write this console offers reaches the cluster after preflight,
            # dry-run and diff. Dry-run was always available regardless of this
            # flag: previewing a change is a read.
            #
            # This is one of TWO gates; the other is the ClusterRoleBinding in
            # rbac.yaml. Flip this back to "false" alone to stop all writes
            # immediately without touching RBAC — every write then returns 403
            # mutations_disabled before the cluster is touched.
            - name: ADMIN_ALLOW_MUTATIONS
              value: "true"
            # Separate gate for a separate blast radius: revealing a Secret's
            # values is a privileged READ, audited whichever way this is set.
            - name: SECRET_REVEAL_ENABLED
              value: "false"
            # §14. OFF, and this is the third gate rather than a detail of the
            # first: an install creates a cluster-scoped ClusterRole that can
            # read every Secret in the cluster — what any ingress controller
            # needs to terminate TLS, and what RBAC cannot narrow — and puts a
            # process on this cluster's ingress path. The install PLAN stays
            # readable with this off, because deciding whether to turn it on
            # means reading what it would create. See adr-0004-shipped-router.md.
            - name: ADMIN_ROUTER_MANAGE_ENABLED
              value: "false"

            # §16. OFF. The gate is not about what this console creates — one
            # Subscription, through the ordinary funnel — but about what OLM
            # does with it afterwards: it installs software nobody here
            # reviewed, under whatever RBAC that operator's
            # ClusterServiceVersion asks for, granted by OLM rather than by the
            # caller. Browsing the catalog and reading the rendered Subscription
            # stay available with this off, because deciding whether to turn it
            # on means reading what it would write.
            # See adr-0005-operator-portal.md.
            - name: ADMIN_PORTAL_INSTALL_ENABLED
              value: "false"

            # §33. OFF, and separate from the gate above on purpose: that one
            # writes one Subscription into an API the cluster already serves,
            # and this one CREATES that API. An install applies eight
            # cluster-scoped CustomResourceDefinitions, two controllers, and a
            # ClusterRole granting every verb on every resource in every API
            # group — including `escalate` and `bind` — which is the widest
            # grant this console can create anywhere. It is inherent to OLM
            # rather than chosen here: OLM installs operators that ask for
            # arbitrary permissions, so it has to hold them.
            #
            # The console's own ServiceAccount cannot create that ClusterRole
            # unless it holds `escalate` and `bind` itself; deploy/rbac.yaml
            # ships that role UNBOUND. Turning this switch on is therefore two
            # decisions, and the second one is in rbac.yaml. The plan and its
            # diff stay readable with this off, because deciding whether to
            # turn it on means reading that ClusterRole first.
            # See adr-0008-shipped-olm.md.
            - name: ADMIN_OLM_INSTALL_ENABLED
              value: "false"

            # How long an install waits for those eight CRDs to report
            # Established before giving up and reporting what it did. One
            # bounded wait inside one request — not a reconcile loop — and
            # generous because establishment is normally sub-second: the cost of
            # waiting too long is a slow request, and the cost of not waiting
            # long enough is eighteen misleading 404s.
            - name: ADMIN_OLM_ESTABLISH_TIMEOUT_SECONDS
              value: "90"

            # §15. OFF, and this gate is about what the feature REMOVES rather
            # than what it creates. A CLI pod is an ordinary pod; the shell into
            # it is not an ordinary write. Everything typed there bypasses the
            # funnel — no preflight naming the permission, no dry run, no diff,
            # and no audit record of what changed. The trail can say a session
            # was opened, by whom and for how long; it cannot say what was run.
            #
            # Turning this on is therefore also a decision about
            # ADMIN_CLI_SERVICE_ACCOUNT below, which is the only thing bounding
            # what those sessions reach. Leaving that at `default` is the safe
            # pairing: kubectl in the pod is refused everything until somebody
            # binds a Role to it. See docs/safety-model.md §9.2.
            - name: ADMIN_CLI_ENABLED
              value: "false"
            - name: ADMIN_CLI_SERVICE_ACCOUNT
              value: "default"

            # ── Console identity ──────────────────────────────────────────
            # ENABLED — the k8boss-admin-auth Secret must exist first, or the
            # backend refuses to start: AUTH_ENABLED with no bootstrap user and
            # no LDAP is a console nobody can log into, and app/identity raises
            # rather than serve one. On first start its credentials create one
            # local administrator; later restarts do not overwrite that
            # account. LDAP settings may be supplied here or through a
            # deployment overlay; see README.md.
            #
            # Load-bearing now that ADMIN_ALLOW_MUTATIONS is true above: mutations
            # without auth means anyone who can reach the console writes to every
            # registered cluster, with audit attribution coming from a spoofable
            # header instead of a logged-in identity.
            - name: AUTH_ENABLED
              value: "true"
            - name: AUTH_COOKIE_SECURE
              value: "true"
            - name: AUTH_BOOTSTRAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-auth
                  key: bootstrap-username
                  optional: true
            - name: AUTH_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-auth
                  key: bootstrap-password
                  optional: true

            # ── Single sign-on (OpenID Connect) ──────────────────────────────
            # Off by default. Turning it on needs AUTH_ENABLED plus an issuer and
            # a client id; with any of the three missing the login page shows no
            # SSO button at all, because a button that cannot work reads as a
            # broken console rather than an unconfigured one.
            #
            # Register the redirect URI at the issuer as
            #   https://<console-host>/api/auth/oidc/callback
            # and set OIDC_REDIRECT_URL to the same string. It is derived from
            # the forwarded Host when empty, which is correct behind exactly one
            # well-behaved ingress and wrong behind anything that rewrites it —
            # and the symptom of a mismatch is an `invalid_grant` from the token
            # endpoint, which reads like a credential problem.
            - name: OIDC_ENABLED
              value: "false"
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-oidc
                  key: issuer
                  optional: true
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-oidc
                  key: client-id
                  optional: true
            # Omit the Secret key entirely for a public client, where PKCE alone
            # protects the code exchange.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-oidc
                  key: client-secret
                  optional: true
            - name: OIDC_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-oidc
                  key: redirect-url
                  optional: true
            # Most issuers omit the groups claim unless the scope is requested
            # AND the client is configured to emit it. Without it the console
            # cannot map roles — and it deliberately leaves existing roles alone
            # rather than demoting everyone, so a missing claim is silent.
            - name: OIDC_SCOPES
              value: "openid profile email"
            - name: OIDC_ADMIN_GROUP
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-oidc
                  key: admin-group
                  optional: true

            # ── The other three single sign-on providers ─────────────────────
            # A curated subset, like everything else in this file: the switch
            # and the values a flow cannot start without. Every other knob
            # (claim and attribute names, allowlists, timeouts, button labels)
            # is in app/config.py with a documented default and is patched onto
            # this Deployment when a deployment needs it. See README.md for the
            # full table and docs/api-contract.md §12.4 for what each provider
            # verifies.

            # Generic OAuth 2.0 — a server that issues an access token and no
            # ID token (GitHub, GitLab, a non-OIDC Keycloak client). Identity
            # comes from the userinfo endpoint, so OAUTH_USERINFO_URL is
            # required and OAUTH_SUBJECT_FIELD must name the provider's own
            # stable identifier: GitHub and GitLab both call it `id`, and
            # binding to a recycled username instead is how the second holder
            # of a name inherits the first one's role.
            - name: OAUTH_ENABLED
              value: "false"
            - name: OAUTH_AUTHORIZATION_URL
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-oauth
                  key: authorization-url
                  optional: true
            - name: OAUTH_TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-oauth
                  key: token-url
                  optional: true
            - name: OAUTH_USERINFO_URL
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-oauth
                  key: userinfo-url
                  optional: true
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-oauth
                  key: client-id
                  optional: true
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-oauth
                  key: client-secret
                  optional: true
            - name: OAUTH_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-oauth
                  key: redirect-url
                  optional: true

            # OpenShift's built-in OAuth server — sign in with the identity
            # already used for `oc login`. OPENSHIFT_API_URL is the API server,
            # not the web console route: the authorization endpoint, the token
            # endpoint and the users/~ read are all taken from it, and pointing
            # it at the console route fails as a 404 on the metadata document.
            #
            # This is the one provider besides OIDC whose sessions may act as a
            # cluster identity under ADR-0007, because the username and groups
            # are the cluster's own record of them.
            - name: OPENSHIFT_ENABLED
              value: "false"
            - name: OPENSHIFT_API_URL
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-openshift
                  key: api-url
                  optional: true
            - name: OPENSHIFT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-openshift
                  key: client-id
                  optional: true
            - name: OPENSHIFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-openshift
                  key: client-secret
                  optional: true
            - name: OPENSHIFT_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-openshift
                  key: redirect-url
                  optional: true

            # SAML 2.0. It additionally needs AUTH_COOKIE_SECURE=true and TLS
            # in front: the assertion arrives on a cross-site POST, which
            # carries no SameSite=Lax cookie, so the handshake cookie has to be
            # SameSite=None — and browsers discard that without Secure. Without
            # it the button is withheld rather than shown broken, so a SAML
            # deployment that looks configured and offers nothing is almost
            # always this.
            #
            # Register the ACS at the identity provider as
            #   https://<console-host>/api/auth/saml/acs
            # or point its setup form at /api/auth/saml/metadata, which
            # publishes the same thing.
            - name: SAML_ENABLED
              value: "false"
            - name: SAML_IDP_ENTITY_ID
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-saml
                  key: idp-entity-id
                  optional: true
            - name: SAML_IDP_SSO_URL
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-saml
                  key: idp-sso-url
                  optional: true
            # The IdP's signing certificate. PEM, or the bare base64 body as it
            # appears in <ds:X509Certificate>. Several may be concatenated,
            # which is what makes a signing-key rotation a Secret update rather
            # than an outage.
            - name: SAML_IDP_CERTIFICATE
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-saml
                  key: idp-certificate
                  optional: true
            - name: SAML_SP_ENTITY_ID
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-saml
                  key: sp-entity-id
                  optional: true
            - name: SAML_ACS_URL
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-saml
                  key: acs-url
                  optional: true

            # ── Sign-in rate limiting ───────────────────────────────────────
            # Each attempt reserves a row before the password is checked, so
            # the limit holds across replicas, survives a restart, and cannot be
            # walked through by a simultaneous burst. 0 disables it, which leaves
            # the login endpoint an unmetered password oracle.
            - name: AUTH_THROTTLE_MAX_ATTEMPTS
              value: "10"
            - name: AUTH_THROTTLE_WINDOW_SECONDS
              value: "300"

            # ── State ───────────────────────────────────────────────────────
            - name: DATABASE_URL
              value: sqlite:////app/data/k8boss_admin.db
            # Optional. Empty means the backend generates a key once and persists
            # it beside the database on the PVC above. Provide it explicitly —
            # through this Secret — if you want the database to be restorable
            # somewhere the key file is not. optional: true so a cluster without
            # the Secret starts rather than crash-looping on a missing key.
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-encryption
                  key: encryption-key
                  optional: true

            # ── Kubernetes access ───────────────────────────────────────────
            # Authenticate with a mounted kubeconfig instead of the pod's own
            # ServiceAccount, so this console can administer a cluster other
            # than (or in addition to) the one it happens to run in, using
            # whatever credentials are already baked into that file. This is
            # the same fallback client.py documents as "local development
            # only" — repurposed here as the console's default identity,
            # reached whenever no cluster has been registered through the UI.
            # Additional clusters can still be registered there with their own
            # endpoint and token; those take precedence over this file for
            # their own cluster_id.
            #
            # Create the Secret before this Deployment starts serving:
            #   kubectl -n k8boss-admin create secret generic k8boss-admin-kubeconfig \
            #     --from-file=config=/path/to/your/kubeconfig
            - name: IN_CLUSTER_MODE
              value: "false"
            - name: KUBECONFIG_PATH
              value: /app/kubeconfig/config
            # Omit to use the kubeconfig's own current-context. Set only if the
            # file carries more than one and the default is the wrong one.
            - name: KUBE_CONTEXT
              valueFrom:
                secretKeyRef:
                  name: k8boss-admin-kubeconfig
                  key: context
                  optional: true

            # §34. OFF here, and off for a reason that does not apply on a
            # laptop: the kubeconfig mounted above is one an administrator put
            # in a Secret for this deployment, and a console that registered a
            # context out of it at boot would turn "the file the pod reads" into
            # "a row in the registry" without anybody asking. On a development
            # machine adoption saves four commands; here the four commands have
            # already been run by whoever created the Secret.
            #
            # It would refuse in most cases anyway — adoption only takes a local
            # cluster, and a kubeconfig mounted into a pod rarely names one — but
            # "it would probably decline" is not a configuration decision.
            - name: ADMIN_AUTO_DISCOVER_LOCAL
              value: "false"
            # Deadlines. Without them a black-holed API server connection pins a
            # threadpool worker forever while the liveness probe below — which
            # touches no cluster — keeps answering healthy, so nothing restarts
            # the pod that has stopped serving.
            - name: K8S_CONNECT_TIMEOUT_SECONDS
              value: "5"
            - name: K8S_READ_TIMEOUT_SECONDS
              value: "30"
            - name: K8S_WATCH_READ_TIMEOUT_SECONDS
              value: "600"

            # ── HTTP ────────────────────────────────────────────────────────
            # The browser talks to nginx, which proxies same-origin, so CORS only
            # matters for a split-origin deployment. Set to the console's public
            # origin if you serve the API on a different host from the SPA.
            - name: CORS_ORIGINS
              value: http://localhost:8021
            - name: LOG_LEVEL
              value: INFO
          # Both probes hit /api/health, which reports on the CONSOLE and never
          # on the clusters it administers: an unreachable customer cluster lands
          # in `degraded[]` and leaves the status 200. A probe that touched a
          # cluster would restart this pod because someone else's API server went
          # down.
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
            # Three misses before a restart: the endpoint opens a database
            # session, and one slow disk moment should not recycle a pod that is
            # mid-write to the audit trail.
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            # Memory is the one that matters: a listing of 5000 pods across a
            # large cluster is deserialised in full before it is trimmed.
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            # readOnlyRootFilesystem: true needs this. A registered cluster with
            # a CA certificate makes the client write that PEM to a temp file —
            # the Kubernetes client library takes a path, not bytes. Without a
            # writable /tmp, every cluster registered with a CA fails to connect
            # and the error is an OSError from deep inside the transport.
            - name: tmp
              mountPath: /tmp
            # KUBECONFIG_PATH above points here. Read-only: the console never
            # writes to it, only the kubernetes client library's config loader
            # reads it at startup.
            - name: kubeconfig
              mountPath: /app/kubeconfig
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: k8boss-admin-data
        - name: tmp
          emptyDir: {}
        - name: kubeconfig
          secret:
            secretName: k8boss-admin-kubeconfig
            # optional: true so a missing Secret doesn't block the pod from
            # scheduling. Without it, the local-kubeconfig fallback in
            # client.py fails to find a file and every request that reaches it
            # raises the same diagnosable NoClusterSelected it raises today
            # when nothing is registered and no kubeconfig is usable — not a
            # crash loop.
            optional: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8boss-admin-frontend
  namespace: k8boss-admin
  labels:
    app.kubernetes.io/name: k8boss-admin
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: k8boss-admin
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8boss-admin
        app.kubernetes.io/component: frontend
    spec:
      # No ServiceAccount token: nginx serves files and proxies HTTP. It has no
      # business holding a credential for the cluster it happens to run in.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's own USER directive is the named `nginx` user, not a
        # numeric uid — some container runtimes can't resolve a name to verify
        # runAsNonRoot without inspecting the image, and refuse to start the
        # container at all ("cannot verify user is non-root") rather than
        # guess. Spelling out its actual uid/gid (nginx:1.27-alpine's stock
        # nginx user) sidesteps that lookup entirely.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/aesaganda/k8boss-admin-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8021
          env:
            # Rendered into the nginx config at container start. This is what
            # makes one image work in compose and in Kubernetes: the /api and
            # /api/ws locations proxy here.
            - name: BACKEND_URL
              value: http://k8boss-admin-backend.k8boss-admin.svc.cluster.local:8020
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # All three are required by readOnlyRootFilesystem, and all three are
            # written by the stock nginx image's own entrypoint rather than by
            # anything this project wrote: conf.d is where the config template is
            # rendered with BACKEND_URL substituted, cache and run are nginx's
            # working directories. Omitting any one produces a container that
            # exits immediately with a permission error from a script nobody in
            # this repository has read.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
