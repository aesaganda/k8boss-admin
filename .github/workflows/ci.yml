# k8boss-admin CI.
#
# Three jobs, all of which must pass, and none of which needs a Kubernetes
# cluster. That is deliberate: a gate that depends on a live cluster is a gate
# that is red for reasons unrelated to the change, and a gate people learn to
# ignore is not a gate.
#
#   backend   pytest against SQLite. The backend's own state is a handful of
#             tables; the Kubernetes side is faked by tests/conftest.py, whose
#             fake RAISES on an unstubbed call rather than returning empty —
#             which is what makes "empty is never blind" testable at all.
#   frontend  npm ci, build, lint.
#   e2e       Playwright against the production build, every /api/** intercepted.
#
# Dev runs SQLite and a production deployment runs PostgreSQL, and this workflow
# only ever exercises SQLite. Anything engine-divergent — a raw SQL fragment, a
# reliance on SQLite's permissive typing — needs a deliberate Postgres check
# before it is believed.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the suite
        # No environment overrides. tests/conftest.py sets DATABASE_URL,
        # ENCRYPTION_KEY, ADMIN_ALLOW_MUTATIONS and SECRET_REVEAL_ENABLED itself,
        # before any app.* import, because app.config builds its Settings at
        # import time. Setting them here as well would let CI and a laptop
        # disagree about the gates the tests run under — and the gates are half
        # of what these tests are about.
        run: python -m pytest -q --junitxml=reports/junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-junit
          path: backend/reports/junit.xml

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        # NOT continue-on-error, and this is a decision rather than an omission.
        #
        # k8boss — the repository this console was split out of — runs its
        # frontend lint advisory (`continue-on-error: true`), which means the job
        # is green whatever ESLint says. What actually happened is that real
        # errors accumulated behind a passing check: nobody sees output from a
        # job that succeeded, so the errors were invisible until someone ran the
        # linter by hand and found a backlog too large to fix in the PR that
        # noticed it. An advisory lint is worse than no lint, because it also
        # occupies the slot where a real one would go.
        #
        # If a rule here is wrong, change the rule in eslint.config.js — where
        # the change is reviewed — rather than making the whole job advisory.
        run: npm run lint

  e2e:
    name: End-to-end (Playwright, route-mocked)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        # Only chromium: playwright.config.js declares exactly one project, and
        # downloading three browsers to run one is two minutes per job for
        # nothing. --with-deps installs the shared libraries the runner image
        # does not ship; without it the browser launch fails with a linker error
        # that reads nothing like a missing package.
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        # playwright.config.js starts its own server (`npm run build && npm run
        # preview`), so there is no service to stand up here — and no backend
        # either. Every spec intercepts `**/api/**`, which is what lets this job
        # assert on the two frontend consumption rules the whole contract leans
        # on: a `partial: true` response renders a persistent banner (§11.1), and
        # a null numeric renders as an em dash rather than as 0 (§11.2).
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
