# k8boss-admin CI.
#
# Four jobs, all of which must pass, and none of which needs a Kubernetes
# cluster. That is deliberate: a gate that depends on a live cluster is a gate
# that is red for reasons unrelated to the change, and a gate people learn to
# ignore is not a gate.
#
#   backend   pytest against SQLite. The backend's own state is a handful of
#             tables; the Kubernetes side is faked by tests/conftest.py, whose
#             fake RAISES on an unstubbed call rather than returning empty —
#             which is what makes "empty is never blind" testable at all.
#   frontend  npm ci, build, lint.
#   e2e       Playwright against the production build, every /api/** intercepted.
#   image     Builds backend/Dockerfile and asserts the vendored OLM release is
#             inside the result and loads. The three jobs above all pass on an
#             image that cannot serve §33, because none of them builds one:
#             `deploy/olm` sits outside a `./backend` build context, so it was
#             omitted silently and only a deployed container ever said so.
#
# Dev runs SQLite and a production deployment runs PostgreSQL, and this workflow
# only ever exercises SQLite. Anything engine-divergent — a raw SQL fragment, a
# reliance on SQLite's permissive typing — needs a deliberate Postgres check
# before it is believed.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the suite
        # No environment overrides. tests/conftest.py sets DATABASE_URL,
        # ENCRYPTION_KEY, ADMIN_ALLOW_MUTATIONS and SECRET_REVEAL_ENABLED itself,
        # before any app.* import, because app.config builds its Settings at
        # import time. Setting them here as well would let CI and a laptop
        # disagree about the gates the tests run under — and the gates are half
        # of what these tests are about.
        run: python -m pytest -q --junitxml=reports/junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-junit
          path: backend/reports/junit.xml

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        # NOT continue-on-error, and this is a decision rather than an omission.
        #
        # k8boss — the repository this console was split out of — runs its
        # frontend lint advisory (`continue-on-error: true`), which means the job
        # is green whatever ESLint says. What actually happened is that real
        # errors accumulated behind a passing check: nobody sees output from a
        # job that succeeded, so the errors were invisible until someone ran the
        # linter by hand and found a backlog too large to fix in the PR that
        # noticed it. An advisory lint is worse than no lint, because it also
        # occupies the slot where a real one would go.
        #
        # If a rule here is wrong, change the rule in eslint.config.js — where
        # the change is reviewed — rather than making the whole job advisory.
        run: npm run lint

  e2e:
    name: End-to-end (Playwright, route-mocked)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        # Only chromium: playwright.config.js declares exactly one project, and
        # downloading three browsers to run one is two minutes per job for
        # nothing. --with-deps installs the shared libraries the runner image
        # does not ship; without it the browser launch fails with a linker error
        # that reads nothing like a missing package.
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        # playwright.config.js starts its own server (`npm run build && npm run
        # preview`), so there is no service to stand up here — and no backend
        # either. Every spec intercepts `**/api/**`, which is what lets this job
        # assert on the two frontend consumption rules the whole contract leans
        # on: a `partial: true` response renders a persistent banner (§11.1), and
        # a null numeric renders as an em dash rather than as 0 (§11.2).
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  image:
    name: Backend image (packaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image
        # From the repository ROOT, which is the whole point of this job. The
        # image needs `deploy/olm` — §33's vendored Operator Lifecycle Manager
        # release, read at run time and pinned by SHA-256 — and that directory is
        # a sibling of `backend/`, so a build context of `./backend` cannot see
        # it. Built that way the files were silently absent: nothing failed,
        # `docker build` was green, the suites below were green, and
        # `GET /api/portal/olm` answered 500 with a FileNotFoundError for
        # `/deploy/olm/crds.yaml` on every deployment of that image.
        run: docker build -f backend/Dockerfile -t k8boss-admin-backend:ci .

      - name: The vendored OLM release is in the image, and it is upstream's
        # Not `ls`. `crd_names()` reads both manifests, checks each against the
        # SHA-256 pinned in `olm_bundle.FILE_DIGESTS`, and parses them through the
        # console's one YAML reading — so this asserts the bundle is present,
        # unaltered and loadable in one call, which is exactly what the endpoint
        # needs of it. The counts are the shape §33 promises: eight
        # CustomResourceDefinitions, twenty-six objects in two phases.
        run: |
          docker run --rm k8boss-admin-backend:ci /opt/venv/bin/python -c "
          from app.admin import olm_bundle as bundle
          directory = bundle._manifest_dir()
          crds, objects = bundle.crd_names(), bundle.build()
          print(f'{directory}: {len(crds)} CRDs, {len(objects)} objects')
          assert len(crds) == 8, crds
          assert len(objects) == 26, len(objects)
          "

      - name: The application starts and answers its own health check
        # The image's HEALTHCHECK is what `autoheal` acts on in a compose
        # deployment, and nothing else in this workflow runs the application as
        # it is actually shipped — wrong CMD, missing runtime dependency, a
        # module that imports cleanly on a laptop and not under the container's
        # interpreter. `--health-start-period` mirrors the Dockerfile so a slow
        # runner is not read as a failure.
        #
        # The waiting is written with `if`, not `[ x = y ] && break`. Steps run
        # under `bash -e`, and a `&&` chain that ends a loop body non-zero takes
        # the whole step with it — which is how the first version of this job
        # failed on its first poll, a second after the container started, and
        # reported it as an unhealthy image.
        run: |
          docker run -d --name backend-ci k8boss-admin-backend:ci
          for _ in $(seq 1 40); do
            state=$(docker inspect -f '{{.State.Health.Status}}' backend-ci)
            if [ "$state" = healthy ] || [ "$state" = unhealthy ]; then
              break
            fi
            sleep 5
          done
          docker logs backend-ci
          test "$(docker inspect -f '{{.State.Health.Status}}' backend-ci)" = healthy

      - name: Stop the container
        if: always()
        run: docker rm -f backend-ci || true
