# k8boss-admin frontend — SPA host and API reverse proxy.
#
# Rendered by the nginx image's entrypoint: the Dockerfile installs this file as
# /etc/nginx/templates/default.conf.template, and envsubst substitutes only names
# that exist in the environment (so ${BACKEND_URL} is replaced and nginx's own
# $uri, $http_upgrade and friends are left alone). BACKEND_URL is what makes one
# image work in compose (http://backend:8020) and in Kubernetes (the backend
# Service DNS name) without a rebuild.

server {
    listen 8021;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The console renders whole resource listings; a 500-item trimmed Deployment
    # list is comfortably a megabyte of JSON before compression.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Uploaded YAML goes through PUT /api/resources/... as a JSON body. nginx's
    # 1m default is generous for a manifest but not for a ConfigMap carrying an
    # embedded certificate bundle, and the failure is a 413 that the UI can only
    # report as "the request failed".
    client_max_body_size 8m;

    # ── WebSockets: pod logs and exec ────────────────────────────────────────
    # MORE SPECIFIC than /api/ below, and nginx picks the longest matching
    # prefix, so the REST path keeps its behaviour exactly.
    #
    # Upgrade and Connection are hop-by-hop headers and nginx drops them unless
    # they are re-set here. Without this block the handshake reaches the backend
    # as a plain GET on a path that only has a @router.websocket handler: no 101,
    # the browser closes with 1006, and the symptom is "the terminal opens and
    # immediately closes" with nothing in the network tab that looks like an
    # error.
    #
    # `^~` for the same reason as the REST block below: without it a WebSocket
    # path ending in a static-asset extension loses to the regex location.
    location ^~ /api/ws/ {
        proxy_pass ${BACKEND_URL}/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A pod that logs nothing for ten minutes is normal, and an idle exec
        # session is a terminal someone left open. The 60s default reaps both and
        # the viewer reports it as a lost connection — which is precisely the
        # confusion the contract's single terminating `end`/`error` frame exists
        # to prevent. Keep this well above any plausible quiet period.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Streamed frames must not sit in a buffer waiting for it to fill: a log
        # tail that arrives in 4 KB batches is not a log tail.
        proxy_buffering off;
    }

    # ── REST API ─────────────────────────────────────────────────────────────
    # `^~` is load-bearing, not decoration: it tells nginx to stop at this prefix
    # and never run the regex round. A plain prefix loses to the static-asset
    # regex below, and Kubernetes object names ending in .js or .svg are legal
    # and common — a ConfigMap called `config.js`, an Ingress called `logo.svg`.
    # Without it, every request about such an object is answered by the static
    # handler: the read 404s, and a write never reaches the funnel, so it never
    # reaches the audit trail either. The operator sees a 404 or a page of HTML
    # and has no way to tell that from "the object is gone".
    location ^~ /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Legacy proxy mode uses X-K8Boss-User as advisory audit attribution.
        # Application-authenticated deployments ignore it and derive the actor
        # from the verified session cookie instead.
        proxy_set_header X-K8Boss-User $http_x_k8boss_user;
        proxy_connect_timeout 10s;
        # Longer than the backend's own 30s Kubernetes read deadline, on purpose.
        # If nginx gives up first the operator gets a 504 from nginx instead of
        # the backend's §1.3 envelope — losing the error code the UI branches on
        # and the hint naming the missing RBAC grant.
        proxy_read_timeout 60s;
    }

    # ── Static assets ────────────────────────────────────────────────────────
    # Filenames are content-hashed by Vite, so immutable is safe. add_header does
    # NOT inherit into a location that sets any add_header of its own, so the
    # server-level security headers are repeated in each block that has one —
    # otherwise every .js and .css response ships without them, which is exactly
    # where a MIME-sniffing browser can do the most damage.
    location ~* \.(js|css|woff2?|ttf|eot|png|jpe?g|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # index.html must always revalidate. Cached, the browser keeps serving a copy
    # that references the previous build's hashed chunk names, and the app's own
    # lazyPage() fallback then renders "this page could not be loaded" on every
    # navigation until a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # SPA fallback. Client-side routes like /workloads/deployments/prod/checkout
    # are not files; without this a page reload or a pasted deep link is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers (server scope) ──────────────────────────────────────
    # style-src allows 'unsafe-inline' because PatternFly injects <style> at
    # runtime. That permits stylesheets, not script, so the boundary script-src
    # draws is unaffected. connect-src 'self' covers the WebSockets above: a
    # same-origin ws:// or wss:// matches 'self'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
}
