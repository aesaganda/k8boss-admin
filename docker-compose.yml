# k8boss-admin — local and small-scale deployment.
#
#   docker compose up --build      →  console on http://localhost:8021
#
# The frontend is the only thing you open. It serves the SPA and reverse-proxies
# /api (and the /api/ws WebSockets for pod logs and exec) to the backend, so the
# browser makes same-origin requests and CORS never enters the picture. The
# backend port is published anyway, because `curl localhost:8020/api/health` is
# the first thing anyone does when the page is blank.

services:
  backend:
    build:
      # The root, not ./backend: the image needs `deploy/olm` (§33's vendored
      # OLM release), which a context of ./backend cannot see. See the comment
      # at the top of backend/Dockerfile.
      context: .
      dockerfile: backend/Dockerfile
    image: k8boss-admin-backend:local
    container_name: k8boss-admin-backend
    # `restart: unless-stopped` only fires on container EXIT — a wedged event
    # loop that stops accepting connections but never crashes the process stays
    # "unhealthy" forever with nothing to restart it. This label is what
    # `autoheal` (below) watches; it force-restarts a container Docker has
    # already marked unhealthy instead of leaving an operator to notice and do
    # it by hand.
    labels:
      - "autoheal=true"
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8020}:8020"
    environment:
      # ── The write gate ───────────────────────────────────────────────────
      # DEFAULT false, and that is not caution for its own sake. There is no
      # authentication in front of this console: with mutations enabled, anyone
      # who can reach the port can scale, restart, delete and drain in every
      # registered cluster, and the only identity on the audit trail comes from
      # the X-K8Boss-User header, which the caller sets themselves.
      #
      # Read-only is therefore the posture a deployment ends up in when nobody
      # made a decision, and turning writes on is an act with a visible line in
      # a file. With it false, writes return 403 mutations_disabled BEFORE the
      # cluster is touched and GET /api/health reports mutations=disabled, so the
      # UI disables the buttons instead of offering them and failing.
      #
      # Dry-run stays available either way: projecting what a write WOULD do is a
      # read, and that is what makes the console useful in an audit posture.
      # Before setting this to true, put an authenticating proxy in front of the
      # published port. See docs/safety-model.md.
      - ADMIN_ALLOW_MUTATIONS=${ADMIN_ALLOW_MUTATIONS:-false}

      # Separate gate, separate blast radius: revealing a Secret's values is a
      # privileged READ, and an operator may reasonably want it without granting
      # writes — or grant writes and still refuse it. Every reveal is audited
      # whichever way this is set.
      - SECRET_REVEAL_ENABLED=${SECRET_REVEAL_ENABLED:-false}

      # The three features with their own gate on top of ADMIN_ALLOW_MUTATIONS.
      # They must be listed HERE, not only in .env: compose interpolates .env
      # into this file, it does not pass it into the container. A var set in
      # .env and missing from this block reaches the backend as its default —
      # the symptom is a feature that stays refused after the operator turned
      # it on and restarted the stack, with nothing to show them why.
      - ADMIN_ROUTER_MANAGE_ENABLED=${ADMIN_ROUTER_MANAGE_ENABLED:-false}
      - ADMIN_PORTAL_INSTALL_ENABLED=${ADMIN_PORTAL_INSTALL_ENABLED:-false}
      - ADMIN_OLM_INSTALL_ENABLED=${ADMIN_OLM_INSTALL_ENABLED:-false}
      - ADMIN_OLM_ESTABLISH_TIMEOUT_SECONDS=${ADMIN_OLM_ESTABLISH_TIMEOUT_SECONDS:-90}
      - ADMIN_ROUTER_NAMESPACE=${ADMIN_ROUTER_NAMESPACE:-k8boss-router}
      - ADMIN_NODE_DEBUG_ENABLED=${ADMIN_NODE_DEBUG_ENABLED:-false}
      - ADMIN_NODE_DEBUG_NAMESPACE=${ADMIN_NODE_DEBUG_NAMESPACE:-default}
      - ADMIN_NODE_DEBUG_MAX_SECONDS=${ADMIN_NODE_DEBUG_MAX_SECONDS:-3600}
      - ADMIN_DEBUG_IMAGE=${ADMIN_DEBUG_IMAGE:-busybox:1.36}
      - ADMIN_CLI_ENABLED=${ADMIN_CLI_ENABLED:-false}
      - ADMIN_CLI_NAMESPACE=${ADMIN_CLI_NAMESPACE:-default}
      - ADMIN_CLI_IMAGE=${ADMIN_CLI_IMAGE:-alpine/k8s:1.34.9}
      # The identity every kubectl command typed in that pod runs as, and the
      # only control over what it can reach: Kubernetes has no RBAC verb for
      # which ServiceAccount a pod may bind. `default` holds no permissions, so
      # the shell arrives able to do nothing until somebody binds a Role to it.
      - ADMIN_CLI_SERVICE_ACCOUNT=${ADMIN_CLI_SERVICE_ACCOUNT:-default}
      - ADMIN_CLI_MAX_SECONDS=${ADMIN_CLI_MAX_SECONDS:-3600}

      # ── Console identity ────────────────────────────────────────────────
      # Opt-in for compatibility. When enabled, every API and WebSocket request
      # except health/login requires an HttpOnly session cookie. The bootstrap
      # password is consumed only when the users table is empty.
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_SESSION_TTL_HOURS=${AUTH_SESSION_TTL_HOURS:-12}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_BOOTSTRAP_USERNAME=${AUTH_BOOTSTRAP_USERNAME:-}
      - AUTH_BOOTSTRAP_PASSWORD=${AUTH_BOOTSTRAP_PASSWORD:-}
      - LDAP_ENABLED=${LDAP_ENABLED:-false}
      - LDAP_URL=${LDAP_URL:-}
      - LDAP_START_TLS=${LDAP_START_TLS:-false}
      - LDAP_TLS_VALIDATE=${LDAP_TLS_VALIDATE:-true}
      - LDAP_CA_CERTIFICATE_FILE=${LDAP_CA_CERTIFICATE_FILE:-}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LDAP_USER_SEARCH_BASE=${LDAP_USER_SEARCH_BASE:-}
      - LDAP_USER_SEARCH_FILTER=${LDAP_USER_SEARCH_FILTER:-(uid={username})}
      - LDAP_USERNAME_ATTRIBUTE=${LDAP_USERNAME_ATTRIBUTE:-uid}
      - LDAP_DISPLAY_NAME_ATTRIBUTE=${LDAP_DISPLAY_NAME_ATTRIBUTE:-cn}
      - LDAP_EMAIL_ATTRIBUTE=${LDAP_EMAIL_ATTRIBUTE:-mail}
      - LDAP_ADMIN_GROUP_DN=${LDAP_ADMIN_GROUP_DN:-}
      - LDAP_CONNECT_TIMEOUT_SECONDS=${LDAP_CONNECT_TIMEOUT_SECONDS:-5}
      # Sign-in rate limiting. Reserved per attempt in the console's database,
      # so it holds across replicas; 0 disables it and leaves the login endpoint
      # unmetered.
      - AUTH_THROTTLE_MAX_ATTEMPTS=${AUTH_THROTTLE_MAX_ATTEMPTS:-10}
      - AUTH_THROTTLE_WINDOW_SECONDS=${AUTH_THROTTLE_WINDOW_SECONDS:-300}
      # OpenID Connect single sign-on. Needs AUTH_ENABLED plus an issuer and a
      # client id — with any of the three missing, no SSO button is offered at
      # all, because a button that cannot work reads as a broken console.
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email}
      - OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL:-}
      - OIDC_USERNAME_CLAIM=${OIDC_USERNAME_CLAIM:-preferred_username}
      - OIDC_EMAIL_CLAIM=${OIDC_EMAIL_CLAIM:-email}
      - OIDC_DISPLAY_NAME_CLAIM=${OIDC_DISPLAY_NAME_CLAIM:-name}
      - OIDC_GROUPS_CLAIM=${OIDC_GROUPS_CLAIM:-groups}
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP:-}
      - OIDC_ALLOWED_GROUPS=${OIDC_ALLOWED_GROUPS:-}
      - OIDC_VERIFY_TLS=${OIDC_VERIFY_TLS:-true}
      - OIDC_CA_CERTIFICATE_FILE=${OIDC_CA_CERTIFICATE_FILE:-}
      - OIDC_TIMEOUT_SECONDS=${OIDC_TIMEOUT_SECONDS:-10}
      - OIDC_CLOCK_SKEW_SECONDS=${OIDC_CLOCK_SKEW_SECONDS:-60}
      - OIDC_BUTTON_LABEL=${OIDC_BUTTON_LABEL:-Single sign-on}

      # Generic OAuth 2.0 sign-on: an authorization server that issues an access
      # token and no ID token (GitHub, GitLab, Gitea, a non-OIDC Keycloak
      # client). Its endpoints are configured individually because a bare OAuth
      # 2.0 server publishes no discovery document to derive them from.
      - OAUTH_ENABLED=${OAUTH_ENABLED:-false}
      - OAUTH_AUTHORIZATION_URL=${OAUTH_AUTHORIZATION_URL:-}
      - OAUTH_TOKEN_URL=${OAUTH_TOKEN_URL:-}
      - OAUTH_USERINFO_URL=${OAUTH_USERINFO_URL:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_SCOPES=${OAUTH_SCOPES:-}
      - OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-}
      - OAUTH_SUBJECT_FIELD=${OAUTH_SUBJECT_FIELD:-sub}
      - OAUTH_USERNAME_FIELD=${OAUTH_USERNAME_FIELD:-preferred_username}
      - OAUTH_EMAIL_FIELD=${OAUTH_EMAIL_FIELD:-email}
      - OAUTH_DISPLAY_NAME_FIELD=${OAUTH_DISPLAY_NAME_FIELD:-name}
      - OAUTH_GROUPS_FIELD=${OAUTH_GROUPS_FIELD:-groups}
      - OAUTH_ADMIN_GROUP=${OAUTH_ADMIN_GROUP:-}
      - OAUTH_ALLOWED_GROUPS=${OAUTH_ALLOWED_GROUPS:-}
      - OAUTH_VERIFY_TLS=${OAUTH_VERIFY_TLS:-true}
      - OAUTH_CA_CERTIFICATE_FILE=${OAUTH_CA_CERTIFICATE_FILE:-}
      - OAUTH_TIMEOUT_SECONDS=${OAUTH_TIMEOUT_SECONDS:-10}
      - OAUTH_BUTTON_LABEL=${OAUTH_BUTTON_LABEL:-OAuth 2.0}

      # OpenShift's built-in OAuth server: sign in with the identity used for
      # `oc login`. One URL — the API server — yields the authorization
      # endpoint, the token endpoint and the users/~ read.
      - OPENSHIFT_ENABLED=${OPENSHIFT_ENABLED:-false}
      - OPENSHIFT_API_URL=${OPENSHIFT_API_URL:-}
      - OPENSHIFT_CLIENT_ID=${OPENSHIFT_CLIENT_ID:-}
      - OPENSHIFT_CLIENT_SECRET=${OPENSHIFT_CLIENT_SECRET:-}
      - OPENSHIFT_SCOPES=${OPENSHIFT_SCOPES:-user:info}
      - OPENSHIFT_REDIRECT_URL=${OPENSHIFT_REDIRECT_URL:-}
      - OPENSHIFT_ADMIN_GROUP=${OPENSHIFT_ADMIN_GROUP:-}
      - OPENSHIFT_ALLOWED_GROUPS=${OPENSHIFT_ALLOWED_GROUPS:-}
      - OPENSHIFT_VERIFY_TLS=${OPENSHIFT_VERIFY_TLS:-true}
      - OPENSHIFT_CA_CERTIFICATE_FILE=${OPENSHIFT_CA_CERTIFICATE_FILE:-}
      - OPENSHIFT_TIMEOUT_SECONDS=${OPENSHIFT_TIMEOUT_SECONDS:-10}
      - OPENSHIFT_BUTTON_LABEL=${OPENSHIFT_BUTTON_LABEL:-OpenShift}

      # SAML 2.0. Note that it also needs AUTH_COOKIE_SECURE=true and a TLS
      # front end: the assertion arrives on a cross-site POST, so the handshake
      # cookie has to be SameSite=None, which browsers discard without Secure.
      # This compose stack serves plain HTTP by default, so SAML is off here
      # until an operator puts TLS in front of it.
      - SAML_ENABLED=${SAML_ENABLED:-false}
      - SAML_IDP_ENTITY_ID=${SAML_IDP_ENTITY_ID:-}
      - SAML_IDP_SSO_URL=${SAML_IDP_SSO_URL:-}
      - SAML_IDP_CERTIFICATE=${SAML_IDP_CERTIFICATE:-}
      - SAML_SP_ENTITY_ID=${SAML_SP_ENTITY_ID:-}
      - SAML_ACS_URL=${SAML_ACS_URL:-}
      - SAML_USERNAME_ATTRIBUTE=${SAML_USERNAME_ATTRIBUTE:-}
      - SAML_EMAIL_ATTRIBUTE=${SAML_EMAIL_ATTRIBUTE:-email}
      - SAML_DISPLAY_NAME_ATTRIBUTE=${SAML_DISPLAY_NAME_ATTRIBUTE:-displayName}
      - SAML_GROUPS_ATTRIBUTE=${SAML_GROUPS_ATTRIBUTE:-groups}
      - SAML_ADMIN_GROUP=${SAML_ADMIN_GROUP:-}
      - SAML_ALLOWED_GROUPS=${SAML_ALLOWED_GROUPS:-}
      - SAML_CLOCK_SKEW_SECONDS=${SAML_CLOCK_SKEW_SECONDS:-60}
      - SAML_BUTTON_LABEL=${SAML_BUTTON_LABEL:-SAML single sign-on}

      # ── State ────────────────────────────────────────────────────────────
      # Registered clusters and the audit trail. Cluster CONTENTS are never
      # cached here — every resource the UI shows is read live — so this volume
      # is small and its loss costs registrations and history, not correctness.
      - DATABASE_URL=sqlite:////app/data/k8boss_admin.db
      # Encryption for stored cluster tokens. Unset means the backend generates a
      # key ONCE and persists it beside the database on the same volume. Do not
      # let that key be ephemeral: a key regenerated at boot makes every stored
      # token undecryptable, and the symptom is every cluster failing to connect
      # after an unrelated restart, which reads as "the console broke my
      # clusters". Set it explicitly for anything you would call production.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}

      # ── Kubernetes transport ─────────────────────────────────────────────
      # Deadlines, so a black-holed API server connection cannot pin a threadpool
      # worker forever while the liveness probe — which touches no cluster —
      # keeps answering healthy.
      - K8S_CONNECT_TIMEOUT_SECONDS=${K8S_CONNECT_TIMEOUT_SECONDS:-5}
      - K8S_READ_TIMEOUT_SECONDS=${K8S_READ_TIMEOUT_SECONDS:-30}
      - K8S_WATCH_READ_TIMEOUT_SECONDS=${K8S_WATCH_READ_TIMEOUT_SECONDS:-600}

      # Local-development fallback, used ONLY when no cluster is registered.
      # Register clusters through the UI for anything else.
      - KUBECONFIG_PATH=/home/k8boss/.kube/config
      - IN_CLUSTER_MODE=${IN_CLUSTER_MODE:-false}

      # ── HTTP ─────────────────────────────────────────────────────────────
      # The browser talks to nginx on 8021 and nginx proxies same-origin, so this
      # list only matters for a split-origin deployment or `npm run dev` on 5174.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8021,http://localhost:5174}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - k8boss-admin-data:/app/data
      # Read-only, and only used when the cluster registry is empty. `:ro` is not
      # decoration: this file is a set of live cluster credentials.
      - ${KUBECONFIG:-~/.kube/config}:/home/k8boss/.kube/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8020/api/health', timeout=4).status_code==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: k8boss-admin-frontend:local
    container_name: k8boss-admin-frontend
    ports:
      - "${UI_PORT:-8021}:8021"
    environment:
      # Rendered into the nginx config at container start. Points at the compose
      # service, so the proxy follows the container rather than a fixed IP.
      - BACKEND_URL=http://backend:8020
    depends_on:
      backend:
        # Not just `depends_on: [backend]`. nginx resolves the upstream hostname
        # when it starts and caches the result; starting before the backend has
        # a container means every /api request 502s until nginx is restarted,
        # which looks exactly like a backend that is down.
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8021/"]
      interval: 30s
      timeout: 5s
      retries: 3

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: k8boss-admin-autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      # Give the backend's own retries (3 x 30s interval, after start_period) a
      # chance to pass first; only act once Docker has settled on "unhealthy"
      # rather than restarting mid-flap.
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_INTERVAL=30
    volumes:
      # Read-only: autoheal only ever calls `docker restart` on containers
      # carrying its label, never anything broader.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  # Named, not a bind mount: it holds the SQLite database AND the generated
  # encryption key that protects the cluster tokens inside it. They live together
  # so a snapshot of this volume captures both or neither — a backup with one and
  # not the other restores to a console whose every credential is unreadable.
  k8boss-admin-data:
    driver: local
